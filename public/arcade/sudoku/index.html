<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Sudoku de a dos 💞</title>

  <!-- Control de acceso e integración en iframe Arcade -->
  <script>
    (function () {
      try {
        if (window.self === window.top) {
          window.location.replace('/?auth_required=arcade');
          return;
        }
        var authKey = sessionStorage.getItem('arcade_session_auth');
        var p = new URLSearchParams(window.location.search);
        if (!authKey && !p.get('auth')) {
          window.location.replace('/?auth_required=arcade');
        }
      } catch (e) {
        window.location.replace('/?auth_required=arcade');
      }
    })();
  </script>

  <link rel="stylesheet" href="sudoku.css">
</head>
<body>

<div class="app-layout">
  <!-- Marcador de Jugadores y Estado de Turno Superior -->
  <header class="top-bar">
    <div class="card card-players">
      <div class="players">
        <div class="pl a" id="pa">
          <input id="na" value="Jugador 1" maxlength="14" aria-label="Nombre Jugador 1">
          <div class="s" id="sa">0</div>
        </div>
        <div class="pl b" id="pb">
          <input id="nb" value="Jugador 2" maxlength="14" aria-label="Nombre Jugador 2">
          <div class="s" id="sb">0</div>
        </div>
      </div>
    </div>

    <!-- Mensaje dinámico de turno y eventos -->
    <div class="card card-msg">
      <div class="msg" id="msg"></div>
    </div>
  </header>

  <!-- Escenario central: Tablero amplio + Teclado numérico y botón de Pistas -->
  <main class="center-stage">
    <div class="board-wrapper">
      <div class="board" id="board"></div>
    </div>

    <div class="pad-wrapper">
      <div class="pad" id="pad"></div>
      <div class="actions-bar">
        <button id="hint" class="btn-hint" type="button">
          <svg class="hint-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18h6" />
            <path d="M10 22h4" />
            <path d="M12 2a7 7 0 0 0-7 7c0 2.6 1.4 4.8 3.5 6h7c2.1-1.2 3.5-3.4 3.5-6a7 7 0 0 0-7-7z" />
          </svg>
          <span class="hint-label">Pista (3 de 3)</span>
        </button>
      </div>
    </div>
  </main>

  <!-- Selectores ocultos (la dificultad se define antes de entrar o al terminar) -->
  <div style="display:none !important">
    <select id="size" aria-label="Tamaño del tablero">
      <option value="6">6×6</option>
      <option value="9" selected>9×9</option>
      <option value="12">12×12</option>
    </select>
    <select id="diff" aria-label="Dificultad">
      <option value="0">Fácil</option>
      <option value="1" selected>Medio</option>
      <option value="2">Difícil</option>
    </select>
  </div>
</div>

<!-- Modal Épico de Fin de Partida (Jugar otra o Subir Dificultad) -->
<div id="win-modal" class="win-modal" style="display:none;">
  <div class="win-card">
    <div class="win-icon">🏆</div>
    <h2 id="win-title">¡Sudoku Completado!</h2>
    <p id="win-desc">¡Excelente trabajo en equipo!</p>
    <div id="win-reward" class="win-reward">+0 monedas ganadas</div>
    <div class="win-buttons">
      <button id="btn-replay" class="btn-win btn-replay" type="button">🔄 Jugar Otra</button>
      <button id="btn-next-diff" class="btn-win btn-next-diff" type="button">⚡ Subir Dificultad</button>
    </div>
  </div>
</div>

<!-- Módulo desacoplado de rescate de LP y monedas -->
<script src="reward-config.js"></script>
<!-- Lógica del juego -->
<script src="sudoku.js"></script>

</body>
</html>
